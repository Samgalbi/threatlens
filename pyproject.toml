[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "threatlens"
version = "0.2.0"
description = "RAG copilot for SOC analysts: MITRE ATT&CK, CWE and CAPEC with verifiable citations"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["E501"]  # line length is enforced by `ruff format`

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC240"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true
